[package]
name = "fanhuaji-tauri"
version = "2.5.2"
edition = "2024"

[lib]
name = "fanhuaji_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fanhuaji-tauri"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
tokio = { version = "1", features = ["fs", "time"] }
zip = "9"
# escape-html: chapters often use HTML entities (&nbsp;, &hellip;) that plain XML rejects.
quick-xml = { version = "0.42", features = ["escape-html"] }
tempfile = "3"
encoding_rs = "0.8"
chardetng = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
