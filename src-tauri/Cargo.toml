[package]
name = "fanhuaji-tauri"
version = "2.5.3"
edition = "2024"

[lib]
name = "fanhuaji_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fanhuaji-tauri"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
fanhuaji-core = { path = "core" }
# Required by tauri::generate_context! and #[tauri::command].
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[workspace]
members = ["core"]
# Plain `cargo test` / `clippy` here also cover the core crate.
default-members = [".", "core"]
