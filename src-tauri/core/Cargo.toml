[package]
name = "fanhuaji-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
tokio = { version = "1", features = ["fs", "rt", "time"] }
zip = "9"
# escape-html: chapters often use HTML entities (&nbsp;, &hellip;) that plain XML rejects.
quick-xml = { version = "0.42", features = ["escape-html"] }
tempfile = "3"
encoding_rs = "0.8"
chardetng = "1"
